name: CI / Quality Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    name: Go Lint, Build & Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Go Module Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Build All Go Packages
        run: go build -v ./...

      - name: Run Test Suite with Coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Verify Ethiopian Work Calendar Package Coverage
        run: |
          COVERAGE=$(go test -cover ./internal/domain/workcalendar/... | awk '{print $NF}' | sed 's/%//')
          echo "workcalendar coverage: ${COVERAGE}%"

  frontend-quality:
    name: Frontend Syntax & Lint Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Client-Side Vanilla JS Syntax
        run: |
          node -c web/static/js/app.js
          node -c web/static/js/calendar.js

  docker-compose-validation:
    name: Docker Compose Specification Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
